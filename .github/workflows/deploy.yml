name: Build Portfolio Frontend

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jadiael-front-${{ github.ref_name == 'main' && 'production' || 'development' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish Image
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true

          tags: ghcr.io/jadiael1/portfolio-jadiael-front:${{ github.ref_name == 'main' && 'production' || 'development' }}-${{ github.sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/Jadiael1/portfolio

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: publish
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ github.ref_name == 'main' && 'https://jadiael.dev' || 'https://dev.jadiael.dev' }}

    steps:
      - name: Deploy frontend
        if: vars.PORTFOLIO_FRONT_DEPLOY_ENABLED == 'true'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          ssh -T -p "$SSH_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "deploy $GITHUB_SHA"